name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -80 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BackStockScanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BackStockScanner
          path: BackStockScanner.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BackStockScanner.apk --title "Back Stock Scanner (latest build)" --notes "Built from ${GITHUB_SHA::7}. Download BackStockScanner.apk on your phone and open it to install."
